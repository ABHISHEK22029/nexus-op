<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The Maks Ops mark: SVG for browsers that take it, a PNG and an .ico
         for the ones that do not (and for the /favicon.ico every browser
         asks for anyway), and full-bleed squares for home screens, which
         round the corners themselves. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#F2590D" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maks Ops — From catalogue to cash</title>
    <meta name="description" content="Maks Ops connects every step of your operation — catalogue, enquiries, quotations, vendor quotes, purchasing, inventory, production and GST invoices — in one place." />
    <!-- Google Fonts: Plus Jakarta Sans + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- The Google Maps JavaScript API used to load here, with the Places
         library, on EVERY page of the site and the app.

         Nothing used it. Searched the whole of src/ for `google.maps`, the
         `google-maps-ready` event it dispatched, the `GOOGLE_MAPS_LOADED`
         flag it set, Autocomplete and PlacesService: zero references. The
         "Leaflet fallback" its onerror mentioned does not exist either —
         leaflet is in package.json but is not imported anywhere.

         So every visitor to maksops.co.in fetched and executed a
         third-party script for nothing, and the Maps JS API is billed per
         load against a live key.

         If Places autocomplete is wanted later, load it from the component
         that needs it rather than from here, so it costs nothing on the
         pages that do not. The key was AIzaSyD-9tSr… — it is in this file's
         git history; rotate it in console.cloud.google.com and restrict the
         new one by HTTP referrer before using it again. -->

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
