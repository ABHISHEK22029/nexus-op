<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <!-- The theme before the first paint, so a dark-theme visitor never
         sees the light page flash first (ThemeContext keeps it after). -->
    <script>try { var t = localStorage.getItem('nexus-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
    <!-- The Maks Ops app icon (the ribbon M — scripts/make-icons.cjs): SVG for browsers that take it, a PNG and an .ico
         for the ones that do not (and for the /favicon.ico every browser
         asks for anyway), and full-bleed squares for home screens, which
         round the corners themselves. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=m2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=m2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=m2" />
    <link rel="manifest" href="/site.webmanifest?v=m2" />
    <meta name="theme-color" content="#F2590D" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- What search engines and link previews read. The homepage's values;
         scripts/prerender.mjs writes each public page's own (src/lib/seo.js),
         and usePageMeta keeps them true as a visitor moves around. -->
    <title>MaksOps — Operations software for manufacturers in India</title>
    <meta name="description" content="MaksOps (Maks Ops) runs a manufacturer’s whole order in one place: catalogue, GST quotations, vendor quote comparison, purchasing, stock, production and invoices." />
    <link rel="canonical" href="https://www.maksops.co.in/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MaksOps" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://www.maksops.co.in/" />
    <meta property="og:title" content="MaksOps — Operations software for manufacturers in India" />
    <meta property="og:description" content="MaksOps (Maks Ops) runs a manufacturer’s whole order in one place: catalogue, GST quotations, vendor quote comparison, purchasing, stock, production and invoices." />
    <meta property="og:image" content="https://www.maksops.co.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MaksOps — from catalogue to cash" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MaksOps — Operations software for manufacturers in India" />
    <meta name="twitter:description" content="MaksOps (Maks Ops) runs a manufacturer’s whole order in one place: catalogue, GST quotations, vendor quote comparison, purchasing, stock, production and invoices." />
    <meta name="twitter:image" content="https://www.maksops.co.in/og-image.png" />
    <!-- Google Fonts: Plus Jakarta Sans + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- The Google Maps JavaScript API used to load here, with the Places
         library, on EVERY page of the site and the app.

         Nothing used it. Searched the whole of src/ for `google.maps`, the
         `google-maps-ready` event it dispatched, the `GOOGLE_MAPS_LOADED`
         flag it set, Autocomplete and PlacesService: zero references. The
         "Leaflet fallback" its onerror mentioned does not exist either —
         leaflet is in package.json but is not imported anywhere.

         So every visitor to maksops.co.in fetched and executed a
         third-party script for nothing, and the Maps JS API is billed per
         load against a live key.

         If Places autocomplete is wanted later, load it from the component
         that needs it rather than from here, so it costs nothing on the
         pages that do not. The key was AIzaSyD-9tSr… — it is in this file's
         git history; rotate it in console.cloud.google.com and restrict the
         new one by HTTP referrer before using it again. -->

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
