## 15. AI-ASSISTED FEATURES & OPERATIONAL INTELLIGENCE

### 15.1 AI Features — Priority Order

```
PHASE 1 — Rule-Based Intelligence (no LLM needed, immediate):
  1. Waste benchmark alerts          → flag when waste > benchmark %
  2. Inventory reorder alerts        → when balance_qty < reorder_level
  3. Agreement expiry alerts         → vendor ISO/agreement 30 days before expiry
  4. Milestone delay detection       → when actual_end > planned_end
  5. PO payment overdue alerts       → when expected_delivery < today and status != Delivered
  6. GST filing reminders            → SCM tracker "Not Filed" > 30 days old
  7. L1 auto-selection in CSQ       → auto-mark lowest total as L1
  8. Auto BOQ progress from MB      → update executed_qty when MB approved

PHASE 2 — AI-Powered Features (RAG chatbot, Spring AI):
  9. Platform assistant chatbot      → answer "how to create a GRN", "what is retention"
  10. Procedure assistant            → answer from ingested SOPs and IS codes
  11. Rate suggestion               → suggest market rate based on past POs for same item

PHASE 3 — Advanced AI (production data needed first):
  12. Procurement delay prediction   → "This vendor is 73% likely to deliver late"
  13. Cost overrun warning           → "Project X is trending 12% over BOQ value"
  14. Optimal cutting plan          → minimize rebar/pipe offcuts from dimensions
  15. Scrap recovery routing        → suggest nearest recycler for scrap material type
```

