### 15.3 Real-Time Dashboard Intelligence

```javascript
// GET /api/dashboard — returns role-aware data with smart insights

function buildDashboardInsights(projectData) {
  const insights = [];

  // PO overdue
  const overduePOs = projectData.pos.filter(p =>
    p.expectedDelivery < new Date() && p.status === 'Dispatched');
  if (overduePOs.length) insights.push({
    type: 'warning', icon: 'alert',
    message: `${overduePOs.length} PO${overduePOs.length > 1 ? 's' : ''} overdue for delivery`,
    action: { label: 'View POs', href: '/po?filter=overdue' }
  });

  // Milestones behind schedule
  const delayedMilestones = projectData.milestones.filter(m =>
    m.actualPct < m.plannedPct - 10);  // >10% behind plan
  if (delayedMilestones.length) insights.push({
    type: 'danger', icon: 'clock',
    message: `${delayedMilestones.length} milestone${delayedMilestones.length > 1 ? 's' : ''} significantly behind schedule`,
    action: { label: 'View Milestones', href: '/milestones?filter=delayed' }
  });

  // Inventory low stock
  const lowStock = projectData.inventory.filter(i =>
    i.reorderLevel && i.balanceQty < i.reorderLevel);
  if (lowStock.length) insights.push({
    type: 'warning', icon: 'box',
    message: `${lowStock.length} material${lowStock.length > 1 ? 's' : ''} below reorder level`,
    action: { label: 'View Inventory', href: '/inventory?filter=low-stock' }
  });

  // Vendor agreement expiry
  const expiringAgreements = projectData.vendors.filter(v => {
    if (!v.agreementExpiry) return false;
    const daysLeft = (new Date(v.agreementExpiry) - new Date()) / 86400000;
    return daysLeft > 0 && daysLeft < 30;
  });
  if (expiringAgreements.length) insights.push({
    type: 'info', icon: 'calendar',
    message: `${expiringAgreements.length} vendor agreement${expiringAgreements.length > 1 ? 's' : ''} expiring within 30 days`,
    action: { label: 'View Vendors', href: '/vendors?filter=expiring' }
  });

  // Bills pending approval
  const pendingBills = projectData.bills.filter(b => b.status === 'Submitted');
  if (pendingBills.length) insights.push({
    type: 'info', icon: 'file',
    message: `${pendingBills.length} RA Bill${pendingBills.length > 1 ? 's' : ''} awaiting Finance approval`,
    action: { label: 'View Bills', href: '/bills?filter=submitted' }
  });

  return insights;
}
```

