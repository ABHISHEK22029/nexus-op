);

-- Auto-update WO completion from BOQ execution
CREATE OR REPLACE FUNCTION nexusop.update_wo_completion()
RETURNS TRIGGER AS $$
BEGIN
  UPDATE nexusop.work_orders wo
  SET completion_pct = (
    SELECT AVG(bi.progress_pct)
    FROM nexusop.boq_items bi
    JOIN nexusop.wo_boq_scope wbs ON wbs.boq_item_id = bi.id
    WHERE wbs.wo_id = wo.id
  )
  WHERE wo.id IN (
    SELECT wbs.wo_id FROM nexusop.wo_boq_scope wbs
    WHERE wbs.boq_item_id = NEW.id
  );
  RETURN NEW;
END;
$$ LANGUAGE plpgsql;

CREATE TRIGGER trg_update_wo_completion
  AFTER UPDATE OF progress_pct ON nexusop.boq_items
  FOR EACH ROW EXECUTE FUNCTION nexusop.update_wo_completion();
```

