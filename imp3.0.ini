## 7. SCM FINANCE TRACKER MODULE

### 7.1 Tracker Table — Live JOIN View

```sql
CREATE OR REPLACE VIEW nexusop.scm_tracker_view AS
SELECT
  ROW_NUMBER() OVER (ORDER BY po.po_date, po.po_number) AS s_no,
  v.name                   AS vendor_name,
  po.po_number,
  po.po_date,
  COALESCE(pli.unit, '')   AS uom,
  COALESCE(pli.quantity,0) AS qty,
  po.sub_total             AS basic_value,
  po.total_gst             AS gst,
  po.grand_total           AS total_value,
  po.payment_terms,
  st.payment_remark,
  st.payment_date,
  COALESCE(st.payment_value, 0) AS payment_value,
  (po.grand_total - COALESCE(st.payment_value, 0)) AS balance_payable,
  g.grn_date               AS material_recd_date,
  COALESCE(g.quantity, 0)  AS material_recd_qty,
  g.qc_status,
  st.remarks,
  v.gstin                  AS gst_number,
  st.lr_number,
  COALESCE(st.invoice_shared, FALSE) AS invoice_shared,
  COALESCE(st.gst_status, 'Not Filed') AS gst_status,
  po.status                AS po_status,
  po.project_id
FROM nexusop.purchase_orders po
LEFT JOIN nexusop.vendors v         ON po.vendor_id = v.id
LEFT JOIN nexusop.po_line_items pli ON pli.po_id = po.id AND pli.sort_order = 1
LEFT JOIN nexusop.grn g             ON g.po_id = po.id
LEFT JOIN nexusop.scm_tracker st    ON st.po_id = po.id
WHERE po.deleted_at IS NULL
ORDER BY po.po_date, po.po_number;
```

