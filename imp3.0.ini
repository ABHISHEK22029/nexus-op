### Template 1 — Earth Pit (full implementation)

```javascript
EARTH_PIT: {
  name: "Electrical Earth Pit",
  category: "Electrical",
  inputs: [
    { key: 'diameter_mm',  label: 'Pit Diameter', unit: 'mm',  type: 'number', required: true  },
    { key: 'depth_m',      label: 'Pit Depth',    unit: 'm',   type: 'number', required: true  },
    { key: 'soil_type',    label: 'Soil Type',                 type: 'select',
      options: ['Normal Soil','Murrum','Hard Rock','Waterlogged','Sandy'],  required: true  },
    { key: 'quantity',     label: 'Number of Pits',             type: 'number', default: 1     },
    { key: 'gi_strip_length', label: 'GI Strip Length', unit: 'm', type: 'number', required: false },
  ],
  calculate: ({ diameter_mm, depth_m, soil_type, quantity, gi_strip_length }) => {
    const r = diameter_mm / 2000;
    const vol = Math.PI * r * r * depth_m;  // cum per pit
    const bfc_vol = vol * 0.85;             // 85% fill with BFC compound
    const bfc_bags = Math.ceil(bfc_vol * 1200 / 25); // 25kg bags

    const SOIL_LABOUR_FACTOR = {
      'Normal Soil': 1.0, 'Murrum': 1.5, 'Hard Rock': 3.0,
      'Waterlogged': 2.0, 'Sandy': 1.2
    };
    const factor = SOIL_LABOUR_FACTOR[soil_type] || 1.0;
    const labour_days = Math.ceil((vol / 0.5) * factor); // 0.5 cum per man-day in normal soil

    return [
      { type: 'Labour',   description: `Earth excavation for pit (${diameter_mm}mm dia × ${depth_m}m)`,
        qty: vol * quantity, unit: 'Cum'  },
      { type: 'Material', description: 'GI Electrode 50mm dia × 2m with GI cap and coupling',
        qty: quantity, unit: 'Nos' },
      { type: 'Material', description: 'BFC Chemical Compound backfill 25kg bag',
        qty: bfc_bags * quantity, unit: 'Bags' },
      { type: 'Material', description: 'GI Strip 25×3mm Hot Dip Galvanized',
        qty: (gi_strip_length || 0) * quantity, unit: 'Mtrs' },
      { type: 'Material', description: 'PVC Pit Cover with locking',
        qty: quantity, unit: 'Nos' },
      { type: 'Labour',   description: 'Pit construction including backfilling',
        qty: labour_days * quantity, unit: 'Man-days' },
    ];
  }
}
```

