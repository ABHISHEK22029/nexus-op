## 9. BAR BENDING SCHEDULE (BBS) CALCULATOR

### 9.1 What BBS Is

BBS = Bar Bending Schedule. A tabulated document showing every steel reinforcement
bar in a concrete structure: mark, dia, shape, length, number, and total weight.
Used in all civil construction to estimate rebar requirement and cutting waste.

### 9.2 BBS Database Schema

```sql
CREATE TABLE nexusop.bbs_schedules (
  id           UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  bbs_number   TEXT UNIQUE,              -- BBS-2027-001
  project_id   UUID REFERENCES nexusop.projects(id),
  work_order_id UUID REFERENCES nexusop.work_orders(id),
  structure_name TEXT NOT NULL,          -- "Column C7", "Beam B3-4", "Foundation F1"
  structure_type TEXT,                   -- Column/Beam/Slab/Foundation/Footing/Wall/Staircase
  drawing_ref  TEXT,
  concrete_grade TEXT DEFAULT 'M25',
  created_by   UUID REFERENCES nexusop.users(id),
  created_at   TIMESTAMPTZ DEFAULT NOW()
);

CREATE TABLE nexusop.bbs_bars (
  id           UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  schedule_id  UUID NOT NULL REFERENCES nexusop.bbs_schedules(id) ON DELETE CASCADE,
  mark         TEXT NOT NULL,            -- Bar mark: A, B, C, 1, 2...
  dia_mm       INTEGER NOT NULL,         -- 8, 10, 12, 16, 20, 25, 32, 40
  shape_code   TEXT,                     -- IS:2502 shape codes: 00, 21, 99...
  a_mm NUMERIC, b_mm NUMERIC, c_mm NUMERIC, d_mm NUMERIC, r_mm NUMERIC,
  -- dimensions per shape code
  nos_per_member INTEGER,               -- bars per structural member
  no_of_members  INTEGER DEFAULT 1,     -- number of identical members
  total_nos      INTEGER,               -- nos_per_member × no_of_members
  cutting_length_mm NUMERIC,            -- calculated from shape + dims
  total_length_mm   NUMERIC,            -- cutting_length × total_nos
  unit_weight_kg_per_m NUMERIC,         -- from IS table: dia²/162
  total_weight_kg NUMERIC,              -- total_length × unit_weight / 1000
  sort_order   INTEGER DEFAULT 0
);

-- View: BBS summary by diameter
CREATE OR REPLACE VIEW nexusop.bbs_summary AS
SELECT
  s.id AS schedule_id,
  s.structure_name,
  b.dia_mm,
  SUM(b.total_nos)       AS total_bars,
  SUM(b.total_length_mm)/1000 AS total_length_m,
  SUM(b.total_weight_kg) AS total_weight_kg,
  -- Add 3% lapping waste + 3% cutting waste
  SUM(b.total_weight_kg) * 1.06 AS required_weight_with_waste
FROM nexusop.bbs_schedules s
JOIN nexusop.bbs_bars b ON b.schedule_id = s.id
GROUP BY s.id, s.structure_name, b.dia_mm
ORDER BY b.dia_mm;
```

### 9.3 BBS Calculation Engine

```javascript
// IS standard unit weights: dia² / 162 (gives kg/m)
const REBAR_UNIT_WEIGHTS = {
  6:  0.222, 8:  0.395, 10: 0.617, 12: 0.888,
  16: 1.578, 20: 2.469, 25: 3.858, 32: 6.313, 40: 9.864
};

// Bending allowances per IS:2502 (deduct from straight length)
const BEND_DEDUCTIONS = {
  45:  { 6: 1, 8: 1.5, 10: 1.5, 12: 2, 16: 2.5, 20: 3 },   // mm deduction at 45°
  90:  { 6: 2, 8: 3,   10: 3.5, 12: 4, 16: 5,   20: 6 },
  135: { 6: 3, 8: 4.5, 10: 5,   12: 6, 16: 7.5, 20: 9 },
  180: { 6: 4, 8: 6,   10: 7,   12: 8, 16: 10,  20: 12 },
};

// Shape code cutting length formulas (IS:2502)
function cuttingLength(shape, dims, dia) {
  const { a, b, c, d, r } = dims;
  const bd90 = BEND_DEDUCTIONS[90][dia] || 0;
  const bd135 = BEND_DEDUCTIONS[135][dia] || 0;

  switch (shape) {
    case '00': return a; // Straight bar
    case '21': return (a + b + (c || 0)) - 2 * bd90;  // U-shape / stirrup
    case '25': return a + b - bd90;  // L-shape
    case '32': return a + 0.42 * b + (2 * (d || 0)) - bd135 - bd90;  // Crank
    case '99': // Circular link
      return Math.PI * (a - dia) + (2 * (b || 200));  // circumference + hooks
    default: return a;
  }
}

function calculateBar(bar) {
  const cl = cuttingLength(bar.shapeCode, bar, bar.diaMm); // mm
  const unitWt = REBAR_UNIT_WEIGHTS[bar.diaMm] || 0;       // kg/m
  const totalNos = bar.nosPerMember * bar.noOfMembers;
  const totalLength = cl * totalNos;                         // mm
  const totalWeight = (totalLength / 1000) * unitWt;         // kg

  return { ...bar, cuttingLengthMm: cl, totalNos, totalLengthMm: totalLength, totalWeightKg: totalWeight };
}

function bbsSummary(bars) {
  const byDia = {};
  bars.forEach(bar => {
    const computed = calculateBar(bar);
    if (!byDia[bar.diaMm]) byDia[bar.diaMm] = { totalWeight: 0, totalLength: 0 };
    byDia[bar.diaMm].totalWeight += computed.totalWeightKg;
    byDia[bar.diaMm].totalLength += computed.totalLengthMm;
  });

  // Add standard waste: 5% for lapping + cutting
  Object.keys(byDia).forEach(dia => {
    byDia[dia].requiredWithWaste = byDia[dia].totalWeight * 1.05;
  });

  return byDia;
}
```

