## 4. WORK ORDER — COMPLETE FLOW & AUTO-GENERATION LOGIC

### 4.1 What a Work Order Is in Nexus-OP

A Work Order (WO) is the operational contract between your organization and a vendor
for a specific scope of work within a project. It differs from a PO:

```
PURCHASE ORDER (PO):          WORK ORDER (WO):
- Buys goods / materials      - Contracts services / labour
- Has delivery to site        - Has execution at site
- Tracked via GRN             - Tracked via Measurement Book
- Payment on delivery         - Payment via RA Bills
- Single transaction          - Ongoing over weeks/months
```

### 4.2 When is a WO Auto-Generated?

```
AUTO-GENERATION TRIGGER SCENARIOS:

Scenario A: From Approved Indent (Labour/Service)
  1. Indent is raised for "Labour for earthwork - 500 cum"
  2. Indent type = SERVICE (not MATERIAL)
  3. Admin approves Indent
  4. System prompts: "This is a service indent. Create a Work Order?"
  5. [Yes — Create WO] → WO form pre-filled from Indent
  6. [No — Create PO instead] → PO form pre-filled

Scenario B: From Approved CSQ (Service vendor)
  1. CSQ is approved for L1 vendor
  2. Vendor type = Sub-Contractor or Labour Contractor
  3. System detects this is a service (not goods) procurement
  4. Prompts: "Create Work Order from this CSQ?"
  5. WO auto-populated: vendor, scope items, rates from CSQ

Scenario C: From Project BOQ (direct WO creation)
  1. PM opens Project → Work Orders → New WO
  2. Selects BOQ items that fall under this WO scope
  3. System calculates WO value from BOQ rates × quantities
  4. WO created directly without PO

Scenario D: Manual creation (always available)
  PM creates WO manually for any service scope
```

### 4.3 WO Auto-Generation Logic (Backend)

```javascript
// backend/services/workOrderService.js

async function evaluateIndentForWO(indentId) {
  const indent = await db.indents.findById(indentId);
  
  // Rule: if indent category is service/labour, suggest WO
  const SERVICE_CATEGORIES = ['Labour', 'Civil Works', 'Electrical Works',
    'Mechanical Works', 'Transportation', 'Consultancy', 'Housekeeping'];
  
  const isServiceIndent = SERVICE_CATEGORIES.includes(indent.category)
    || indent.unit === 'LS'  // Lump Sum — almost always a service
    || indent.unit === 'Job';
  
  return {
    suggestWO: isServiceIndent,
    suggestPO: !isServiceIndent,
    prefilledData: {
      projectId: indent.projectId,
      workOrderName: indent.item,
      description: indent.purpose,
      vendorId: indent.preferredVendor,
      estimatedValue: indent.estimatedTotal,
      startDate: new Date(),
      boqItemId: indent.boqItemId,
    }
  };
}

// POST /api/indent/:id/convert → returns { suggestWO, prefilledData }
// POST /api/work-orders/from-indent/:indentId → creates WO
// POST /api/work-orders/from-csq/:csqId → creates WO
```

### 4.4 Work Order State Machine

```
DRAFT → ACTIVE → COMPLETED → CLOSED
  ↓         ↓
CANCELLED  ON HOLD → ACTIVE (resume)

State rules:
  DRAFT:     WO created, not started, can be edited freely
  ACTIVE:    Work in progress, MB entries being recorded
  ON HOLD:   Temporarily paused (funding, material, dispute)
  COMPLETED: All BOQ scope executed, final MB approved
  CLOSED:    All RA bills paid, retention released
  CANCELLED: WO abandoned (with mandatory reason)
```

