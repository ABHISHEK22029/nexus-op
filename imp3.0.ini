## FORMULAS — QUICK REFERENCE

```javascript
// All financial formulas used in the system:

// PO Tax (Intra-state)
SGST = subtotal × 0.09
CGST = subtotal × 0.09
PO_VALUE = subtotal + SGST + CGST

// PO Tax (Inter-state)
IGST = subtotal × 0.18
PO_VALUE = subtotal + IGST

// Advance
ADVANCE = PO_VALUE × (advance_pct / 100)
BALANCE = PO_VALUE - ADVANCE_PAID

// RA Bill
GROSS = Σ(mb_qty × boq_rate)
CURRENT = GROSS - CUMULATIVE_PREVIOUS
RETENTION = CURRENT × (retention_pct / 100)
TDS = CURRENT × (tds_rate / 100)
ADVANCE_RECOVERY = mobilisation_advance × (recovery_pct / 100)
NET_PAYABLE = CURRENT - RETENTION - TDS - ADVANCE_RECOVERY - OTHER_DEDUCTIONS

// Material waste
WASTE_QTY = INPUT_QTY - OUTPUT_QTY
WASTE_PCT = (WASTE_QTY / INPUT_QTY) × 100
NET_LOSS = (WASTE_QTY × INPUT_RATE) - (RECYCLABLE_QTY × SCRAP_RATE)

// BBS unit weight (IS standard)
UNIT_WEIGHT_KG_PER_M = dia_mm² / 162

// Concrete mix design (approximate per cum)
M20: Cement = 8 bags, Sand = 0.45 cum, Aggregate = 0.90 cum
M25: Cement = 9.5 bags, Sand = 0.42 cum, Aggregate = 0.84 cum
M30: Cement = 10.8 bags, Sand = 0.41 cum, Aggregate = 0.82 cum

// Earth pit
PIT_VOLUME = π × (diameter/2)² × depth  (cum)
BFC_BAGS = CEIL((pit_volume × 0.85 × 1200) / 25)  (25 kg bags)
```

