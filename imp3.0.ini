## 5. INVOICE & PO GENERATION SYSTEM

### 5.1 PO Auto-Numbering

```javascript
// Format: ORG_CODE/FY-YEAR/SEQUENCE
// Example: Kirashi/FY2026-27/007

function getCurrentFY() {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + 1;
  if (month >= 4) return `${year}-${String(year+1).slice(-2)}`;
  return `${year-1}-${String(year).slice(-2)}`;
}

async function getNextPONumber(orgCode, supabase) {
  const fy = getCurrentFY(); // "2026-27"
  const prefix = `${orgCode}/FY${fy}/`;
  const { data } = await supabase
    .from('purchase_orders')
    .select('po_number')
    .ilike('po_number', `${prefix}%`)
    .order('po_number', { ascending: false })
    .limit(1);
  const last = data?.[0]?.po_number;
  const lastSeq = last ? parseInt(last.split('/').pop()) : 0;
  return `${prefix}${String(lastSeq + 1).padStart(3, '0')}`;
}
```

### 5.2 Tax Calculation Engine (complete)

```javascript
const GSTIN_STATE_CODES = {
  '36': 'Telangana', '27': 'Maharashtra', '24': 'Gujarat',
  '29': 'Karnataka', '33': 'Tamil Nadu', '07': 'Delhi',
  '06': 'Haryana', '09': 'Uttar Pradesh', '19': 'West Bengal',
};

function getStateFromGSTIN(gstin) {
  return GSTIN_STATE_CODES[gstin.substring(0, 2)] || 'Unknown';
}

function calculatePOTaxes(lineItems, vendorGSTIN, orgGSTIN) {
  const vendorState = getStateFromGSTIN(vendorGSTIN);
  const orgState = getStateFromGSTIN(orgGSTIN);
  const isInterState = vendorState !== orgState;

  let subtotal = 0, sgst = 0, cgst = 0, igst = 0;

  lineItems.forEach(item => {
    const taxable = item.qty * item.unitPrice * (1 - (item.discountPct || 0) / 100);
    subtotal += taxable;
    const gstRate = item.gstRate || 18;
    if (isInterState) {
      igst += taxable * gstRate / 100;
    } else {
      sgst += taxable * (gstRate / 2) / 100;
      cgst += taxable * (gstRate / 2) / 100;
    }
  });

  const totalTax = sgst + cgst + igst;
  const poValue = subtotal + totalTax;
  return { subtotal, sgst, cgst, igst, totalTax, poValue, isInterState };
}
```

### 5.3 Amount in Words — Indian Number System

```javascript
const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven',
              'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen',
              'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty',
              'Sixty', 'Seventy', 'Eighty', 'Ninety'];

function twoDigits(n) {
  if (n < 20) return ones[n];
  return tens[Math.floor(n/10)] + (n % 10 ? ' ' + ones[n % 10] : '');
}

function threeDigits(n) {
  if (n >= 100) return ones[Math.floor(n/100)] + ' Hundred' +
    (n % 100 ? ' ' + twoDigits(n % 100) : '');
  return twoDigits(n);
}

export function amountInWords(amount) {
  if (amount === 0) return 'Zero Only';
  const rupees = Math.floor(amount);
  const paise = Math.round((amount - rupees) * 100);
  let result = '';
  const crore = Math.floor(rupees / 10000000);
  const lakh  = Math.floor((rupees % 10000000) / 100000);
  const thou  = Math.floor((rupees % 100000) / 1000);
  const rem   = rupees % 1000;
  if (crore) result += threeDigits(crore) + ' Crore ';
  if (lakh)  result += threeDigits(lakh)  + ' Lakh ';
  if (thou)  result += threeDigits(thou)  + ' Thousand ';
  if (rem)   result += threeDigits(rem);
  result = result.trim() + ' Rupees';
  if (paise) result += ' and ' + twoDigits(paise) + ' Paise';
  return result + ' Only';
}
// amountInWords(873200) → "Eight Lakh Seventy Three Thousand Two Hundred Rupees Only"
```

