### 3.4 Zoho Workflow Philosophy — The Rules

```
Rule 1: Every entity has a clear state machine (never ambiguous status)
Rule 2: Every state transition is logged (who, when, note)
Rule 3: Every transition triggers a notification (in-app + email)
Rule 4: Approval gates prevent bypassing (Finance can't skip approval)
Rule 5: Soft deletes only — nothing is permanently deleted without audit
Rule 6: Every monetary field shows currency symbol + comma formatting
Rule 7: Every form has keyboard navigation (Tab between fields)
Rule 8: PDF generation is always available on completed documents
Rule 9: Mobile views work — responsive but not native-app-equivalent
Rule 10: Error messages are human-readable, not technical
```

