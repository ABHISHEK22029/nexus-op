# ⚠ THIS FILE DOES NOT CONFIGURE THE LIVE BACKEND.
#
# It declares a service called `nexus-op-backend`. Production is
# `nexus-op-2.onrender.com`, and on Render the subdomain is the service
# name — so the live service is `nexus-op-2`, created by hand in the
# dashboard rather than from this blueprint. A blueprint only manages the
# services it declares, so nothing here is read.
#
# Anything added below — including ALLOW_SELF_REGISTRATION — has to be set
# in the Render dashboard under the service's Environment tab as well, or
# it never takes effect. Adding it here alone is what left self-registration
# switched off in production after it had supposedly been enabled.
#
# To make this file authoritative, rename the service below to match the
# live one and adopt it as a Blueprint in Render.
services:
  - type: web
    name: nexus-op-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Self-registration. Without one of these, POST /auth/register answers
      # 403 "Self-registration is disabled" and the /signup page cannot work
      # — which is how it stood until now.
      #
      # `true` means anyone who reaches the URL can create an account. Since
      # every account now gets its own company profile and its own scoped
      # data, that is a stranger with an empty workspace rather than a
      # stranger in yours — but it is still an open door on a public URL.
      #
      # For invite-only instead: delete this and set SIGNUP_TOKEN to a secret
      # (sync: false), which new users must present to register.
      - key: ALLOW_SELF_REGISTRATION
        value: "true"
