# ⚠ THIS FILE DOES NOT CONFIGURE THE LIVE BACKEND.
#
# It declares a service called `nexus-op-backend`. Production is
# `nexus-op-2.onrender.com`, and on Render the subdomain is the service
# name — so the live service is `nexus-op-2`, created by hand in the
# dashboard rather than from this blueprint. A blueprint only manages the
# services it declares, so nothing here is read.
#
# Anything added below — including ALLOW_SELF_REGISTRATION — has to be set
# in the Render dashboard under the service's Environment tab as well, or
# it never takes effect. Adding it here alone is what left self-registration
# switched off in production after it had supposedly been enabled.
#
# To make this file authoritative, rename the service below to match the
# live one and adopt it as a Blueprint in Render.
services:
  - type: web
    name: nexus-op-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    # ── REGION: the single biggest lever on this app's speed ──
    #
    # The database is Supabase ap-south-1 (Mumbai). A service in Oregon
    # pays ~250ms per query reaching it; from Singapore it is ~55ms, and
    # ~25ms measured from India. A screen makes 3-7 queries, so on the
    # US-West service that is 0.75-1.75 SECONDS of pure distance, before
    # any work is done. The users are in India too, so they pay the same
    # gap again on their own hop to the server.
    #
    # Singapore is the closest region Render offers to Mumbai; there is no
    # Indian region. Frankfurt is roughly twice as far.
    #
    # A region CANNOT be changed on an existing Render service. Moving
    # means creating a new service and pointing the frontend at it.
    region: singapore
    # Without this, Render defaults a new web service to 0.5c-512mb, which
    # is a PAID plan — the blueprint then stops and asks for a card before
    # it will create anything. Omitting the field does not mean "free".
    #
    # Free is 0.1 CPU / 512MB, spins down after 15 minutes idle (~1 minute
    # to wake), and draws on 750 instance-hours per workspace per month.
    # Change this to 0.5c-512mb when the cold start stops being acceptable;
    # that is the only thing on this page that costs money.
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      # NOT generateValue. A fresh secret invalidates every token that has
      # already been issued, so everyone signed in is logged out the moment
      # the frontend switches over. Copy the value from the existing
      # service so sessions survive the move; sync:false keeps it out of
      # this file, which is public.
      - key: JWT_SECRET
        sync: false
      # Self-registration. Without one of these, POST /auth/register answers
      # 403 "Self-registration is disabled" and the /signup page cannot work
      # — which is how it stood until now.
      #
      # `true` means anyone who reaches the URL can create an account. Since
      # every account now gets its own company profile and its own scoped
      # data, that is a stranger with an empty workspace rather than a
      # stranger in yours — but it is still an open door on a public URL.
      #
      # For invite-only instead: delete this and set SIGNUP_TOKEN to a secret
      # (sync: false), which new users must present to register.
      - key: ALLOW_SELF_REGISTRATION
        value: "true"
      # Session-mode pooler: each pool slot holds one real Postgres
      # connection for as long as the service is up. Two services running
      # side by side during a region cutover hold 4 each. Keep the overlap
      # short and do not raise this while both are live.
      - key: PG_POOL_MAX
        value: "4"
      # Everything below is optional; the app runs without them. Listed so
      # a new service can be brought up with the same behaviour as the old
      # one rather than subtly different.
      - key: JWT_TTL
        value: 12h
      - key: METALPRICEAPI_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: OPENROUTER_REFERRER
        sync: false
