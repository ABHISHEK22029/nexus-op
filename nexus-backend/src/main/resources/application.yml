spring:
  profiles:
    active: ${SPRING_PROFILE:local}

  jpa:
    hibernate:
      ddl-auto: none        # Liquibase manages schema
    properties:
      hibernate:
        format_sql: false
    show-sql: false
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

server:
  port: 8080
  servlet:
    context-path: /api

nexusop:
  jwt:
    secret: ${JWT_SECRET:nexusop-local-dev-secret-key-min-256-bits-change-in-production-env}
    expiration-ms: 86400000   # 24 hours
  cors:
    allowed-origins: ${CORS_ORIGIN:http://localhost:5173}
  pg-notify:
    channel: ui_config_changed
    poll-interval-ms: 500

logging:
  level:
    com.nexusop: DEBUG
    org.springframework.security: WARN
    liquibase: INFO

---
# ═══ LOCAL PROFILE — PostgreSQL on localhost ═══
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/nexusop_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 300000

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

---
# ═══ H2 PROFILE — For testing without PostgreSQL ═══
spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: jdbc:h2:file:./data/nexusop;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  liquibase:
    enabled: false           # H2 uses JPA auto-create for now

  jpa:
    hibernate:
      ddl-auto: create-drop  # Auto-create tables in H2

---
# ═══ CLOUD PROFILE — Supabase / AWS RDS (for future) ═══
spring:
  config:
    activate:
      on-profile: cloud

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
