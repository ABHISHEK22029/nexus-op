spring:
  datasource:
    # ── UPDATE THESE 3 VALUES with correct Supabase connection ──
    # Go to: Supabase → Project Settings → Database → Connection string
    url: jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require&prepareThreshold=0
    username: postgres.xkopxriicqxwgvbwbzdk
    password: ${DB_PASSWORD:NexusOP202412}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: none        # Liquibase manages schema
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: false          # ← DISABLED until DB connection is verified

server:
  port: 8080
  servlet:
    context-path: /api

nexusop:
  jwt:
    secret: ${JWT_SECRET:nexusop-local-dev-secret-key-min-256-bits-change-in-production}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGIN:http://localhost:5173}
  pg-notify:
    channel: ui_config_changed
    poll-interval-ms: 500

logging:
  level:
    com.nexusop: DEBUG
    org.springframework.security: WARN
    liquibase: INFO
