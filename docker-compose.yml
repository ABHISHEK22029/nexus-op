version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexusop_db
    environment:
      POSTGRES_DB: nexusop
      POSTGRES_USER: nexusop_admin
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusop_admin -d nexusop"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nexusop_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nexusop.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
